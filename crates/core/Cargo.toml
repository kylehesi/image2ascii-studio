[package]
name = "image2ascii-core"
description = "Image to ASCII conversion core: decoding, tone mapping, glyph calibration, matching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ascii", "ascii-art", "image", "svg", "converter"]
categories = ["multimedia::images", "graphics"]

[features]
default = ["parallel", "embedded-font"]
# Multi-core processing via rayon. Off for WebAssembly; results are identical either way.
parallel = ["dep:rayon"]
# Bundles JetBrains Mono (OFL 1.1, ~270 KB) as `fonts::DEFAULT`.
embedded-font = []

[dependencies]
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
rayon = { version = "1", optional = true }
thiserror = "2"
ttf-parser = "0.25"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
roxmltree = "0.21"

[[bench]]
name = "convert"
harness = false
