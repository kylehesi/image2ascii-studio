[package]
name = "image2ascii-studio"
description = "Convert images to ASCII art: text, animated SVG and PNG, from the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ascii", "ascii-art", "image", "cli", "svg"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
anyhow = "1"
image2ascii-core.workspace = true
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "image2ascii"
path = "src/main.rs"
